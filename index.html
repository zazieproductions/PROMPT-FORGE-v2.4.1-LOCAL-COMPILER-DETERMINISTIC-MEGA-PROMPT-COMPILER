  <script>
    const DB_NAME = 'PromptForgeDB';
    const DB_VERSION = 2;
    const STORE_NAME = 'forged_presets';
    const SEED_STORE_NAME = 'style_seeds';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains(SEED_STORE_NAME)) {
            db.createObjectStore(SEED_STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // ---- STYLE SEED CORPUS (input -> enhanced output pairs) ----
    function _seedStore(mode) {
      try {
        return initDB().then(db => db.transaction(SEED_STORE_NAME, mode).objectStore(SEED_STORE_NAME));
      } catch (err) {
        return Promise.resolve(null);
      }
    }
    async function dbSaveSeed(seed) {
      try {
        const store = await _seedStore('readwrite');
        if (store) { store.put(seed); await new Promise(r => { setTimeout(r, 60); }); return true; }
      } catch (err) { /* fall through */ }
      const stored = JSON.parse(localStorage.getItem(SEED_STORE_NAME) || '[]');
      const idx = stored.findIndex(s => s.id === seed.id);
      if (idx >= 0) stored[idx] = seed; else stored.unshift(seed);
      localStorage.setItem(SEED_STORE_NAME, JSON.stringify(stored));
      return true;
    }
    async function dbGetSeeds() {
      try {
        const store = await _seedStore('readonly');
        if (store) {
          return new Promise((resolve) => {
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          });
        }
      } catch (err) { /* fall through */ }
      return JSON.parse(localStorage.getItem(SEED_STORE_NAME) || '[]');
    }
    async function dbDeleteSeed(id) {
      try {
        const store = await _seedStore('readwrite');
        if (store) { store.delete(id); await new Promise(r => { setTimeout(r, 60); }); return true; }
      } catch (err) { /* fall through */ }
      const stored = JSON.parse(localStorage.getItem(SEED_STORE_NAME) || '[]').filter(s => s.id !== id);
      localStorage.setItem(SEED_STORE_NAME, JSON.stringify(stored));
      return true;
    }

    async function dbSavePreset(preset) {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(preset);
        return new Promise((resolve) => {
          tx.oncomplete = () => resolve(true);
        });
      } catch (err) {
        console.warn('IDB Save Failed, fallback to localstorage', err);
        const stored = JSON.parse(localStorage.getItem(STORE_NAME) || '[]');
        const idx = stored.findIndex(p => p.id === preset.id);
        if (idx >= 0) stored[idx] = preset;
        else stored.unshift(preset);
        localStorage.setItem(STORE_NAME, JSON.stringify(stored));
        return true;
      }
    }

    async function dbGetPresets() {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        return new Promise((resolve) => {
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (err) {
        return JSON.parse(localStorage.getItem(STORE_NAME) || '[]');
      }
    }

    async function dbDeletePreset(id) {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        return new Promise((resolve) => {
          tx.oncomplete = () => resolve(true);
        });
      } catch (err) {
        let stored = JSON.parse(localStorage.getItem(STORE_NAME) || '[]');
        stored = stored.filter(p => p.id !== id);
        localStorage.setItem(STORE_NAME, JSON.stringify(stored));
        return true;
      }
    }
  </script>

/* ================================================================= PARSERS */
function cleanEntityName(raw) {
  if (!raw) return '';
  return raw
    .replace(/["'`]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/[.,;:!?]+$/, '')
    .trim();
}

function looksLikeBrand(token) {
  if (!token) return false;
  if (/[a-z0-9]\.[a-z]{2,}/i.test(token)) return true;           // radioreach.us
  if (/^[A-Z][a-z]+[A-Z]/.test(token)) return true;              // RadioReach
  if (TECH_ACRONYMS.has(token.toUpperCase())) return false;       // DSP, KPI, SaaS
  if (/^(?=.*[A-Z])[A-Z0-9]{2,}$/.test(token)) return true;      // RRC
  if (/^[A-Z][a-z]+(\s+[A-Z][a-z]+)+$/.test(token)) return true;  // Radio Reach
  return false;
}

function extractEntity(raw) {
  const text = (raw || '').trim();
  if (!text) return { name: 'The Mission', url: '' };

  let url = '';
  const urlMatch = text.match(/(?:https?:\/\/)?(?:www\.)?([a-z0-9][a-z0-9-]{1,40}(?:\.[a-z0-9-]+)*\.[a-z]{2,})(?:\/[^\s,)]*)?/i);
  if (urlMatch) url = urlMatch[1].toLowerCase();

  // 0. "called Ember & Oak" / "named Foo" — explicitly named entity
  const named = text.match(/\b(?:called|named|titled)\s+["'\u201c]?([A-Z][\w&.\-]*(?:\s+(?:&|and)?\s*[A-Z][\w&.\-]*){0,2})["'\u201d]?/);
  if (named) {
    const n0 = cleanEntityName(named[1]);
    if (n0 && n0.length > 1) {
      if (!url && /\.[a-z]{2,}$/i.test(n0)) url = n0.toLowerCase();
      return { name: cleanEntityName(n0.replace(/\.(us|com|io|ai|co|net|org|app|dev)$/i, '')) || n0, url };
    }
  }

  // 1. "for my startup RadioReach.US"
  const hint = text.match(/\b(?:my|our)\s+(?:startup|brand|company|project|business|site|store|shop|channel|app|product|agency|newsletter|show|podcast|band|book|platform|studio|venture|page|account|saas|tool|game)\s+["'\u201c]?([A-Za-z0-9][\w&.\- ]{0,40}?)["'\u201d]?(?=\s*(?:,|;|\.|for\b|that\b|which\b|with\b|in\b|on\b|to\b|and\b|but\b|$))/i);
  if (hint) {
    const h = cleanEntityName(hint[1]);
    const brandy = h && (
      /[a-z][A-Z]/.test(h) || /\.[a-z]{2,}$/i.test(h) ||
      /^[A-Z][a-z]+(?:[A-Z]|$)/.test(h) || /^(?=.*[A-Z])[A-Z0-9]{2,}$/.test(h)
    );
    if (brandy && h.length > 1) {
      if (!url && /\.[a-z]{2,}$/i.test(h)) url = h.toLowerCase();
      return { name: cleanEntityName(h.replace(/\.(us|com|io|ai|co|net|org|app|dev)$/i, '')) || h, url };
    }
  }

  // 2. Explicit URL
  if (url) {
    const bare = cleanEntityName(url.split('/')[0].split('.')[0]);
    if (bare && bare.length > 2 && !GENERIC_CAPS.has(bare.toUpperCase())) {
      return { name: bare.charAt(0).toUpperCase() + bare.slice(1), url };
    }
  }

  // 3. Quoted
  const quoted = text.match(/["'\u201c\u201d]([^"'\u201c\u201d]{2,40})["'\u201c\u201d]/);
  if (quoted) return { name: cleanEntityName(quoted[1]), url };

  // 4. Multi-word Title Case run ("Halcyon Drift", "Ember & Oak", "Radio Reach")
  const toks = text.replace(/[^A-Za-z0-9&.\-\s]/g, ' ').split(/\s+/).filter(Boolean);
  let runBest = null;
  for (let i = 0; i < toks.length; i++) {
    if (TECH_NOUNS.has(toks[i]) || GENERIC_CAPS.has(toks[i].toUpperCase())) continue;
    if (!/^[A-Z][a-z]+$/.test(toks[i]) && !/^[A-Z][a-z]+$/.test(toks[i].replace(/&$/, ''))) continue;
    let j = i; const parts = [];
    while (j < toks.length) {
      const t = toks[j];
      if (t === '&' || t === 'and') { if (parts.length) { parts.push(t); j++; continue; } else break; }
      if (!/^[A-Z][a-z]+$/.test(t)) break;
      parts.push(t); j++;
      if (parts.filter(p => /[A-Za-z]/.test(p)).length >= 3) break;
    }
    const words = parts.filter(p => /[A-Za-z]/.test(p));
    if (words.length >= 2) {
      const cand = parts.join(' ');
      if (!runBest || words.length > runBest.words) runBest = { text: cand, words: words.length };
    }
  }
  if (runBest) return { name: runBest.text, url };

  // 5. Single brand-shaped token (CamelCase, dotted domain, ALLCAPS)
  let best = null; let bestScore = 0;
  for (const tok of toks) {
    const clean = tok.replace(/[^A-Za-z0-9&.\-]/g, '');
    if (!clean || clean.length < 3) continue;
    if (GENERIC_CAPS.has(clean)) continue;
    let score = 0;
    if (looksLikeBrand(clean)) score = 45;
    else if (/^[A-Z][a-z]+$/.test(clean)) score = 12;
    if (clean.includes('.')) score += 30;
    if (/[a-z][A-Z]/.test(clean)) score += 20;
    if (score > bestScore) { bestScore = score; best = clean; }
  }
  if (best && bestScore >= 40) {
    return { name: cleanEntityName(best.replace(/\.(us|com|io|ai|co|net|org|app|dev)$/i, '')) || best, url };
  }
  return { name: '', url };
}

function extractAudience(raw) {
  const text = (raw || '').toLowerCase();
  const tokens = text.split(/[^a-z0-9\s'-]+/).join(' ').split(/\s+/).filter(Boolean);

  for (let i = 0; i < tokens.length; i++) {
    if (AUDIENCE_LEXICON.indexOf(tokens[i]) === -1) continue;
    // Walk backwards to collect the descriptor phrase ("busy business owners")
    const start = Math.max(0, i - 5);
    const phrase = tokens.slice(start, i + 1).join(' ');
    if (phrase.split(' ').length >= 2 && !/(i|my|our|me|want|need|for|to|a|an|the|and|or|with|get|make|build|create)/.test(phrase.split(' ')[0])) {
      return phrase;
    }
    return tokens[i];
  }
  return '';
}

function extractDescriptor(raw, pack) {
  const text = (raw || '').toLowerCase();
  const m = text.match(/\b(?:it is|it's|its a|its an|they are|it's really)\s+([a-z][a-z\s,'-]{3,60})/);
  if (m) {
    const d = cleanEntityName(m[1]);
    if (d && d.split(' ').length <= 8) return d;
  }
  return pack.defaultDescriptor;
}

function extractMoney(raw) {
  const text = (raw || '').toLowerCase();
  const figs = text.match(/(\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|couple|dozen)\s*[- ]?figures?/);
  if (figs) {
    const token = figs[1];
    const n = WORD_NUMBERS[token] !== undefined ? WORD_NUMBERS[token] : parseInt(token, 10);
    if (n > 0 && n <= 12) return { source: 'figures', figures: n, headline: Math.pow(10, n) };
  }
  const sym = text.match(/\$\s*([\d][\d,.]*)\s*([km])?/);
  if (sym) {
    let base = parseFloat(sym[1].replace(/,/g, ''));
    if (sym[2] === 'k') base *= 1e3;
    if (sym[2] === 'm') base *= 1e6;
    if (base > 0) return { source: 'symbol', figures: Math.max(1, Math.round(Math.log10(base))), headline: base, explicit: base };
  }
  return null;
}

function usd(n) {
  const r = Math.round(n);
  return '$' + r.toLocaleString('en-US');
}

function buildMoney(intent, pack) {
  const money = intent.money || { source: 'default', figures: pack.defaultFigures, headline: Math.pow(10, pack.defaultFigures || 6) };
  let target;
  if (money.source === 'symbol' && money.explicit) {
    target = money.explicit * 12;
  } else {
    target = money.headline * 0.25;
  }
  target = Math.max(1000, Math.round(target));
  return {
    figures: money.figures,
    headline: money.headline,
    target: usd(target),
    first: usd(target * 0.4),
    runRate: usd(target * 0.16),
    horizon: '12 months',
    midpoint: 6
  };
}

function detectArchetype(raw) {
  const text = (raw || '').toLowerCase();
  if (!text.trim()) return 'universal_genius';

  const art = earliestArtifact(text);
  const affinity = art ? ARTIFACT_PACK_AFFINITY[art] : null;
  const earlyZone = Math.max(12, text.length * 0.35);

  let bestId = affinity || 'universal_genius';
  let bestScore = affinity ? 7 : 0;

  Object.keys(ASCENSION_ARCHETYPES).forEach(id => {
    const pack = ASCENSION_ARCHETYPES[id];
    let score = (id === affinity) ? 7 : 0;
    pack.keywords.forEach(k => {
      const pos = kwHitIndex(text, k);
      if (pos === -1) return;
      score += k.indexOf(' ') !== -1 ? 5 : 3;
      if (pos <= earlyZone) score += 2;
    });
    if (score > bestScore) { bestScore = score; bestId = id; }
  });

  return bestScore <= 0 ? 'universal_genius' : bestId;
}

function detectArtifact(raw) {
  return earliestArtifact((raw || '').toLowerCase()) || 'mission';
}

function prettyArtifact(a) {
  if (!a) return 'Mission';
  return a.charAt(0).toUpperCase() + a.slice(1);
}

function parseAscensionIntent(raw, forcedPackId) {
  const pack = ASCENSION_ARCHETYPES[forcedPackId] || ASCENSION_ARCHETYPES[detectArchetype(raw)];
  const entity = extractEntity(raw);
  return {
    raw: raw || '',
    pack,
    archetypeId: pack.id,
    entity: entity.name || ('The ' + prettyArtifact(detectArtifact(raw))),
    entityUrl: entity.url,
    audience: extractAudience(raw) || pack.defaultAudience,
    descriptor: extractDescriptor(raw, pack),
    money: extractMoney(raw),
    artifact: detectArtifact(raw)
  };
}

const DEFAULT_SEED_PROFILE = {
  lawCount: 12,
  protocolCount: 6,
  useEntityLinks: false,
  closingQuestion: true,
  source: 'default',
  samples: 0
};

function countNumberedItems(text, headingRe) {
  const m = text.match(headingRe);
  if (!m) return 0;
  // Skip to the end of the heading's LINE: the match covers only the phrase
  // ("Immutable Laws"), not the rest of the line ("** (violation = death):"),
  // which would otherwise be counted as the first block.
  const lineEnd = text.indexOf('\n', m.index + m[0].length);
  const tail = lineEnd === -1 ? '' : text.slice(lineEnd);
  const block = tail.split(/\n\s*\n/).filter(chunk => chunk.trim().length > 0)[0] || '';
  const items = block.match(/^\s*\d+\.\s+\S/gm);
  return items ? items.length : 0;
}

function analyzeSeedOutput(output) {
  const text = output || '';
  return {
    lawCount: countNumberedItems(text, /immutable\s+laws/i) || 12,
    protocolCount: countNumberedItems(text, /protocol|procedure|operating\s+system/i) || 6,
    useEntityLinks: /\[[^\]]+\]\((?:https?:)?\/\/[^)]+\)/.test(text),
    closingQuestion: /\?\s*$/.test(text.trim()),
    words: text.trim().split(/\s+/).length
  };
}

function modeOf(arr, fallback) {
  if (!arr.length) return fallback;
  const counts = {};
  arr.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  let best = arr[0]; let bestN = 0;
  Object.keys(counts).forEach(k => { if (counts[k] > bestN) { bestN = counts[k]; best = Number(k); } });
  return best;
}

function deriveSeedProfile(seeds) {
  if (!seeds || !seeds.length) return { ...DEFAULT_SEED_PROFILE };
  const analyzed = seeds.map(s => analyzeSeedOutput(s.output || s.enhanced || ''));
  const links = analyzed.filter(a => a.useEntityLinks).length;
  const closes = analyzed.filter(a => a.closingQuestion).length;
  return {
    lawCount: modeOf(analyzed.map(a => a.lawCount), 12),
    protocolCount: modeOf(analyzed.map(a => a.protocolCount), 6),
    useEntityLinks: links * 2 > analyzed.length,
    closingQuestion: closes * 2 >= analyzed.length,
    source: 'seed',
    samples: seeds.length
  };
}

        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(centerX, centerY) - 28;

        ctx.clearRect(0, 0, width, height);

        // Draw concentric web rings
        const rings = 4;
        for (let r = 1; r <= rings; r++) {
          const ringRadius = (radius / rings) * r;
          ctx.beginPath();
          ctx.strokeStyle = r === rings ? '#2D3D58' : '#141E2E';
          ctx.lineWidth = 1;
          for (let i = 0; i < metrics.length; i++) {
            const angle = (Math.PI * 2 / metrics.length) * i - Math.PI / 2;
            const x = centerX + Math.cos(angle) * ringRadius;
            const y = centerY + Math.sin(angle) * ringRadius;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();
        }

        // Draw spoke lines & labels
        metrics.forEach((m, i) => {
          const angle = (Math.PI * 2 / metrics.length) * i - Math.PI / 2;
          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius;

          ctx.beginPath();
          ctx.strokeStyle = '#182232';
          ctx.lineWidth = 1;
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(x, y);
          ctx.stroke();

          // Text label
          const labelDist = radius + 14;
          const lx = centerX + Math.cos(angle) * labelDist;
          const ly = centerY + Math.sin(angle) * labelDist;

          ctx.font = '9px "JetBrains Mono", monospace';
          ctx.fillStyle = '#64748B';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(m.label, lx, ly);
        });

        // Draw Filled DNA Polygon
        ctx.beginPath();
        metrics.forEach((m, i) => {
          const angle = (Math.PI * 2 / metrics.length) * i - Math.PI / 2;
          const val = (dna[m.key] || 50) / 100;
          const currentRadius = radius * val;
          const x = centerX + Math.cos(angle) * currentRadius;
          const y = centerY + Math.sin(angle) * currentRadius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();

        // Polygon Fill
        ctx.fillStyle = 'rgba(0, 240, 255, 0.18)';
        ctx.fill();

        // Polygon Stroke
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0; // reset

        // Draw Vertex Points
        metrics.forEach((m, i) => {
          const angle = (Math.PI * 2 / metrics.length) * i - Math.PI / 2;
          const val = (dna[m.key] || 50) / 100;
          const currentRadius = radius * val;
          const x = centerX + Math.cos(angle) * currentRadius;
          const y = centerY + Math.sin(angle) * currentRadius;

          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });

      }, [dna, color, metrics]);

      return (
        <div className="relative flex flex-col items-center justify-center p-2 rounded-lg bg-panel border border-borderDim">
          <canvas ref={canvasRef} width={220} height={200} className="w-[220px] h-[200px]" />
          <div className="text-[10px] font-mono text-gray-400 mt-1 uppercase tracking-widest flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
            PROMPT DNA TELEMETRY
          </div>
        </div>
      );
    }

                  <i data-lucide="flame" className="w-4 h-4 fill-current"></i>
                  FORGE MEGA-PROMPT
                  <span className="text-[10px] bg-void/20 px-1.5 py-0.5 rounded font-mono ml-2">
                    {compiled.tokenEstimate} TOKENS
                  </span>
                </button>
              </div>

            </div>


            {/* ========================================================================= */}
            {/* RIGHT / MEGA-PROMPT COMPILER STUDIO (7 Cols)                             */}
            {/* ========================================================================= */}
            <div className="lg:col-span-7 bg-[#06090E] flex flex-col h-auto lg:h-[calc(100vh-53px)] overflow-hidden">
              
              {/* Studio Header & Metrics Bar */}
              <div className="p-3.5 border-b border-borderDim bg-panel/80 flex flex-wrap items-center justify-between gap-2">
                
                {/* Telemetry badges */}
                <div className="flex items-center gap-2">
                  <span className="text-xs font-mono font-bold text-gray-200 flex items-center gap-1.5">
                    <i data-lucide="cpu" className="w-3.5 h-3.5 text-cyan-400"></i>
                    COMPILED ARTIFACT
                  </span>

                  <div className="hidden sm:flex items-center gap-1.5 text-[11px] font-mono text-gray-400">
                    <span className="px-2 py-0.5 rounded bg-panelAlt border border-borderDim text-cyan-300">
                      {compiled.tokenEstimate.toLocaleString()} est. tokens
                    </span>
                    <span className="px-2 py-0.5 rounded bg-panelAlt border border-borderDim text-gray-300">
                      {compiled.charCount.toLocaleString()} chars
                    </span>
                    <span className="px-2 py-0.5 rounded bg-panelAlt border border-borderDim text-emerald-400">
                      {compiled.sections.length} modules
                    </span>
                  </div>
                </div>

                {/* View switcher & Copy Trigger */}
                <div className="flex items-center gap-2">
                  <div className="flex rounded bg-panelAlt border border-borderDim p-0.5">
                    <button
                      onClick={() => setViewMode('rendered')}
                      className={`px-2.5 py-1 text-xs font-mono rounded transition-all ${
                        viewMode === 'rendered' ? 'bg-cyan-950 text-cyan-300 border border-cyan-800' : 'text-gray-400 hover:text-white'
                      }`}
                    >
                      STRUCTURED
                    </button>
                    <button
                      onClick={() => setViewMode('raw')}
                      className={`px-2.5 py-1 text-xs font-mono rounded transition-all ${
                        viewMode === 'raw' ? 'bg-cyan-950 text-cyan-300 border border-cyan-800' : 'text-gray-400 hover:text-white'
                      }`}
                    >
                      RAW TEXT
                    </button>
                  </div>

                  <button
                    onClick={copyToClipboard}
                    className={`px-4 py-1.5 rounded text-xs font-mono font-bold flex items-center gap-1.5 transition-all ${
                      copied
                        ? 'bg-emerald-500 text-void shadow-glow-cyan'
                        : 'bg-cyan-500 hover:bg-cyan-400 text-void'
                    }`}
                  >
                    <i data-lucide={copied ? "check" : "copy"} className="w-3.5 h-3.5"></i>
                    {copied ? 'COPIED TO CLIPBOARD' : 'COPY PROMPT'}
                  </button>
                </div>
              </div>

              {/* Mega-Prompt Content Viewer Area */}
              <div className="flex-1 p-4 lg:p-6 overflow-y-auto space-y-6 font-mono text-sm leading-relaxed">
                
                {/* Visualizer Bar Banner */}
                <div className="p-3 rounded-lg border border-borderDim bg-panel/40 flex flex-wrap items-center justify-between gap-3 text-xs">
                  <div className="flex items-center gap-2 flex-wrap">
                    <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: compiled.domain.color }}></div>
                    <span className="font-mono text-gray-300">
                      {compiled.ascension ? 'OPERATOR' : 'TARGET'}: <strong className="text-white">{compiled.domain.name}</strong>
                    </span>
                    <span className="text-gray-600">|</span>
                    <span className="text-gray-300">INTENSITY: <strong className="text-cyan-300">{compiled.intensity.name}</strong></span>
                    {compiled.ascension && (
                      <>
                        <span className="text-gray-600">|</span>
                        <span className="text-gray-300">ENTITY: <strong className="text-fuchsia-300">{compiled.intent.entity}</strong></span>
                        {compiled.money && (
                          <>
                            <span className="text-gray-600">|</span>
                            <span className="text-gray-300">STAKE: <strong className="text-emerald-300">{compiled.money.target} / {compiled.money.horizon}</strong></span>
                          </>
                        )}
                      </>
                    )}
                  </div>
                  <div className="text-[11px] text-gray-400">
                    Deterministic Assembly @ {lastForgedTime}
                  </div>
                </div>

                {viewMode === 'raw' ? (
                  /* RAW MONOSPACE TEXT VIEW */
                  <pre className="p-4 rounded-lg bg-panel border border-borderDim text-slate-200 text-xs font-mono overflow-x-auto code-editor-layer selection:bg-cyan-500/40">
                    {compiled.fullText}
                  </pre>
                ) : (
                  /* STRUCTURED MODULAR SECTION BLOCKS */
                  <div className="space-y-4">
                    {compiled.sections.map((sec, idx) => (
                      <div
                        key={sec.id}
                        className="rounded-lg border border-borderDim bg-panel/90 overflow-hidden hover:border-borderBright transition-all shadow-terminal"
                      >
                        {/* Section Header */}
                        <div className="px-4 py-2.5 bg-panelAlt/90 border-b border-borderDim flex items-center justify-between">
                          <span className="font-mono font-bold text-xs text-cyan-300 flex items-center gap-2">
                            <span className="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                            {sec.title}
                          </span>
                          <span className="text-[10px] font-mono text-gray-400">
                            SECTION #{idx + 1}
                          </span>
                        </div>
                        {/* Section Body */}
                        <div className="p-4 text-xs font-mono text-slate-200 whitespace-pre-wrap leading-relaxed selection:bg-cyan-500/30">
                          {sec.content}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Bottom Status Bar */}
              <div className="px-4 py-2 border-t border-borderDim bg-panelAlt/80 flex items-center justify-between text-[11px] font-mono text-gray-400">
                <div className="flex items-center gap-3">
                  <span className="flex items-center gap-1">
                    <i data-lucide="check" className="w-3 h-3 text-emerald-400"></i> Local-Only Logic
                  </span>
                  <span className="hidden sm:inline-block text-gray-600">•</span>
                  <span className="hidden sm:inline-block">Deterministic Pattern Synthesis</span>
                </div>
                <div>
                  READY FOR LLM INGESTION (CLAUDE 3.7 / GPT-4.5 / O3 / DEEPSEEK-R1)
                </div>
              </div>

            </div>

          </div>

          {/* ========================================================================= */}
          {/* PRESETS & HISTORY MODAL / DRAWER                                          */}
          {/* ========================================================================= */}
          {isHistoryOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-panel border-l border-borderDim h-full flex flex-col p-4 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-borderDim">
                  <h3 className="font-mono font-bold text-sm text-white flex items-center gap-2">
                    <i data-lucide="folder" className="w-4 h-4 text-cyan-400"></i>
                    SAVED PRESETS & RECENT FORGES
                  </h3>
                  <button
                    onClick={() => setIsHistoryOpen(false)}
                    className="p-1 rounded hover:bg-panelAlt text-gray-400 hover:text-white"
                  >
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto py-3 space-y-4">
                  {/* Saved User Presets */}
                  <div>
                    <div className="text-xs font-mono font-semibold text-cyan-400 mb-2">
                      INDEXEDDB SAVED PRESETS ({savedPresets.length})
                    </div>
                    {savedPresets.length === 0 ? (
                      <p className="text-xs font-mono text-gray-500 italic p-3 bg-void/50 rounded border border-borderDim">
                        No saved presets found. Click "SAVE PRESET" on the header to store your configurations locally.
                      </p>
                    ) : (
                      <div className="space-y-2">
                        {savedPresets.map(preset => (
                          <div
                            key={preset.id}
                            onClick={() => loadPreset(preset)}
                            className="p-2.5 rounded bg-panelAlt border border-borderDim hover:border-cyan-400/60 cursor-pointer transition-all flex items-center justify-between group"
                          >
                            <div>
                              <div className="text-xs font-mono font-bold text-white group-hover:text-cyan-300">
                                {preset.name}
                              </div>
                              <div className="text-[10px] font-mono text-gray-400">
                                {preset.date} — Domain: {DOMAIN_PACKS[preset.state?.domainKey]?.name || 'Standard'}
                              </div>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <button
                                onClick={(e) => deletePreset(preset.id, e)}
                                title="Delete preset"
                                className="p-1 rounded text-gray-500 hover:text-crimson hover:bg-void"
                              >
                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Transient Session History */}
                  {history.length > 0 && (
                    <div>
                      <div className="text-xs font-mono font-semibold text-gray-300 mb-2">
                        RECENT CLIPBOARD FORGES
                      </div>
                      <div className="space-y-2">
                        {history.map(item => (
                          <div key={item.id} className="p-2 rounded bg-void/50 border border-borderDim text-xs font-mono">
                            <div className="flex justify-between text-[10px] text-cyan-400">
                              <span>{item.domain}</span>
                              <span className="text-gray-500">{item.timestamp}</span>
                            </div>
                            <div className="text-gray-300 mt-1 truncate">{item.task}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-borderDim">
                  <button
                    onClick={exportJSON}
                    className="w-full py-2 px-3 text-xs font-mono rounded bg-panelAlt border border-borderDim hover:border-borderBright text-gray-300 flex items-center justify-center gap-2"
                  >
                    <i data-lucide="file-json" className="w-3.5 h-3.5 text-cyan-400"></i>
                    EXPORT ALL CONFIGS AS JSON
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* SAVE PRESET MODAL                                                         */}
          {/* ========================================================================= */}
          {showSaveModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-panel border border-cyan-500/40 rounded-lg p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-borderDim pb-2">
                  <h3 className="font-mono font-bold text-sm text-white flex items-center gap-2">
                    <i data-lucide="save" className="w-4 h-4 text-cyan-400"></i>
                    SAVE CURRENT PRESET
                  </h3>
                  <button
                    onClick={() => setShowSaveModal(false)}
                    className="text-gray-400 hover:text-white"
                  >
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-mono text-gray-300 block">
                    Preset Label / Identifier:
                  </label>
                  <input
                    type="text"
                    value={presetNameInput}
                    onChange={(e) => setPresetNameInput(e.target.value)}
                    placeholder={`e.g. Master DSP Rig [${DOMAIN_PACKS[domainKey].name}]`}
                    className="w-full p-2.5 rounded bg-void border border-borderDim text-xs font-mono text-white focus:border-cyan-400 outline-none"
                    autoFocus
                  />
                  <p className="text-[10px] font-mono text-gray-500">
                    Saves entire state (Task, Domain, Roles, Sliders, Behavior Rules) to your browser's IndexedDB.
                  </p>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowSaveModal(false)}
                    className="px-3 py-1.5 rounded text-xs font-mono bg-panelAlt border border-borderDim text-gray-300 hover:bg-borderDim"
                  >
                    CANCEL
                  </button>
                  <button
                    onClick={saveCurrentPreset}
                    className="px-4 py-1.5 rounded text-xs font-mono font-bold bg-cyan-500 hover:bg-cyan-400 text-void"
                  >
                    SAVE TO STORAGE
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Subtle Scanline Effect */}
          <div className="scanlines fixed inset-0 pointer-events-none z-30 opacity-40"></div>
        </div>
      );
    }

    // Render the React Application into DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PromptForgeApp />);
  </script>
</body>
</html>
